version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - ecommerce_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - ecommerce_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - ecommerce_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: ecommerce_django
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./django_app:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - '8000:8000'
    networks:
      - ecommerce_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: ecommerce_fastapi
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4
    volumes:
      - ./fastapi_app:/app
    ports:
      - '8001:8001'
    networks:
      - ecommerce_network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: ecommerce_celery
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./django_app:/app
    networks:
      - ecommerce_network
    depends_on:
      - django
      - redis

  celery_beat:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: ecommerce_celery_beat
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./django_app:/app
    networks:
      - ecommerce_network
    depends_on:
      - django
      - redis

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - '80:80'
    networks:
      - ecommerce_network
    depends_on:
      - django
      - fastapi

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  ecommerce_network:
    driver: bridge
